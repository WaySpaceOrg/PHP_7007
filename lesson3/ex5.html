<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เครื่องคิด BMI</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .box { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 90px; }
        input { padding: 5px; width: 150px; }
        button { padding: 5px 15px; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>เครื่องคิด BMI</h2>
    <div class="form-group">
        <label for="weight">น้ำหนัก (กก.):</label>
        <input type="number" id="weight" step="any">
    </div>
    <div class="form-group">
        <label for="height">ส่วนสูง (ชม.):</label>
        <input type="number" id="height" step="any">
    </div>
    <button id="calc">คำนวณ</button>

    <div id="result"></div>
</div>

<script>
    document.getElementById('calc').addEventListener('click', function() {
        let weightInput = document.getElementById('weight').value.trim();
        let heightInput = document.getElementById('height').value.trim();
        let resultDiv = document.getElementById('result');

        // ตรวจสอบเงื่อนไข: หากช่องใดว่าง หรือเป็น 0
        if (weightInput === "" || heightInput === "" || Number(weightInput) <= 0 || Number(heightInput) <= 0) {
            resultDiv.innerHTML = "กรุณากรอกน้ำหนักและส่วนสูง";
            return;
        }

        let weight = parseFloat(weightInput);
        let heightCm = parseFloat(heightInput);

        // แปลงส่วนสูงจาก เซนติเมตร เป็น เมตร
        let heightM = heightCm / 100;

        // คำนวณ BMI = น้ำหนัก (กก.) / (ส่วนสูง (ม.) * ส่วนสูง (ม.))
        let bmi = weight / (heightM * heightM);
        let bmiFixed = bmi.toFixed(1);

        // ตัดสินกลุ่มจากค่าจริง (ก่อนปัดเศษ)
        let category = "";
        if (bmi < 18.5) {
            category = "น้ำหนักน้อย";
        } else if (bmi < 25) {
            category = "ปกติ";
        } else {
            category = "น้ำหนักเกิน";
        }

        // แสดงผลลัพธ์
        resultDiv.innerHTML = `BMI ${bmiFixed} (${category})`;
    });
</script>

</body>
