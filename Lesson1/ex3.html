<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบฝึกหัดที่ 3 | ตารางข้อมูล</title>
  <style>
    :root {
      --pink: #f7c8dc;
      --purple: #d9ccff;
      --blue: #c9e8ff;
      --ink: #51465f;
      --muted: #82758e;
      --white: rgba(255,255,255,.88);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 42px 18px;
      font-family: "Prompt", "Noto Sans Thai", Tahoma, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #fff0f6 0%, #f2edff 52%, #eaf7ff 100%);
    }
    .page { width: min(850px, 100%); margin: 0 auto; }
    .top { text-align: center; margin-bottom: 26px; }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 14px;
      display: grid; place-items: center; border-radius: 25px;
      background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
      box-shadow: 0 10px 24px rgba(135, 112, 168, .18);
      font-size: 36px;
    }
    .eyebrow { color: #9b82b4; font-size: .88rem; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 8px 0; font-size: clamp(1.7rem, 5vw, 2.35rem); }
    .subtitle { margin: 0; color: var(--muted); }
    .panel {
      background: var(--white); border: 1px solid rgba(255,255,255,.9);
      border-radius: 26px; padding: clamp(20px, 5vw, 34px);
      box-shadow: 0 18px 45px rgba(115, 99, 145, .12);
      backdrop-filter: blur(8px);
    }
    .panel h2 { margin: 0 0 8px; font-size: 1.25rem; }
    .hint { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
    .table-wrap { overflow-x: auto; border-radius: 17px; }
    table { width: 100%; border-collapse: collapse; min-width: 420px; text-align: center; }
    thead { background: linear-gradient(100deg, #f8d8e7, #e5dcff, #d9efff); }
    th { padding: 17px 14px; font-weight: 700; }
    td { padding: 17px 14px; background: #fff; border-bottom: 1px solid #f0eaf5; }
    tbody tr:nth-child(even) td { background: #fbf8ff; }
    tbody tr:hover td { background: #fff0f6; transition: background .2s ease; }
    tbody tr:last-child td { border-bottom: 0; }
    .number {
      display: inline-grid; place-items: center; width: 34px; height: 34px;
      border-radius: 12px; background: #f2eaff; color: #8067a5; font-weight: 700;
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 25px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 20px; border-radius: 999px; text-decoration: none;
      color: #594b6b; font-weight: 700; background: linear-gradient(100deg, #f8d8e7, #e2d9ff);
      box-shadow: 0 6px 15px rgba(135, 112, 168, .13);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn.secondary { background: #fff; border: 1px solid #eadff5; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 9px 18px rgba(135, 112, 168, .2); }
    footer { text-align: center; color: #9a8ca6; font-size: .85rem; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="logo" aria-hidden="true">💜</div>
      <div class="eyebrow">PHP LEARNING • LESSON 1</div>
      <h1>แบบฝึกหัดที่ 3</h1>
      <p class="subtitle">การสร้างตารางข้อมูลด้วย HTML</p>
    </header>

    <section class="panel">
      <h2>ตารางข้อมูล</h2>
      <p class="hint">ตัวอย่างการจัดเรียงข้อมูลให้อยู่ในรูปแบบแถวและคอลัมน์</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>รหัส</th>
              <th>ชื่อ</th>
              <th>นามสกุล</th>
            </tr>
          </thead>
          <tbody>
            <tr><td><span class="number">11</span></td><td>12</td><td>13</td></tr>
            <tr><td><span class="number">21</span></td><td>22</td><td>23</td></tr>
            <tr><td><span class="number">31</span></td><td>32</td><td>33</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="actions" aria-label="เมนูนำทาง">
        <a class="btn" href="../index.html">⌂ กลับหน้าหลัก</a>
        <a class="btn secondary" href="index.html">← กลับ Lesson 1</a>
        <a class="btn secondary" href="ex2.html">แบบฝึกหัดก่อนหน้า</a>
        <a class="btn secondary" href="ex4.html">แบบฝึกหัดถัดไป →</a>
      </nav>
    </section>
    <footer>Made with pastel colors ♡ PHP Learning</footer>
  </main>
</body>
</html>
